<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Info</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            color-scheme: dark;
            --primary: #d7b477;
            --primary-soft: rgba(215, 180, 119, .13);
            --bg: #111310;
            --surface: #191c18;
            --card: #20241f;
            --card-raised: #252a24;
            --text: #f2f0e9;
            --text-secondary: #a7aaa0;
            --success: #8ac99a;
            --error: #ed8d82;
            --line: rgba(242, 240, 233, .09);
            --shadow: 0 18px 48px rgba(0, 0, 0, .22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 50% -18%, rgba(215, 180, 119, .10), transparent 55%), var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 48px 20px 24px;
        }

        .container {
            width: min(100%, 900px);
            margin: 0 auto;
            padding: clamp(24px, 5vw, 48px);
            padding-bottom: 8px;
            background: rgba(25, 28, 24, .92);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: var(--shadow);
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--line);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.7rem, 5vw, 2.35rem);
            font-weight: 650;
            letter-spacing: -.045em;
        }

        .subtitle {
            color: var(--text-secondary);
            margin: 9px 0 0;
            font-size: .95rem;
        }

        .status {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 9px 13px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, .025);
            font-size: .8rem;
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--error);
            box-shadow: 0 0 10px rgba(237, 141, 130, .45);
            transition: background .2s, box-shadow .2s;
        }

        .dot.online {
            background: var(--success);
            box-shadow: 0 0 10px rgba(138, 201, 154, .5);
        }

        .navigation {
            display: flex;
            gap: 10px;
            padding: 22px 0 28px;
        }

        .mat-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            background: rgba(255, 255, 255, .035);
            font: inherit;
            font-size: .85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: border-color .2s, background .2s, transform .2s;
        }

        .mat-btn:hover {
            border-color: rgba(215, 180, 119, .45);
            background: var(--primary-soft);
            transform: translateY(-1px);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            transition: background .2s, border-color .2s;
        }

        .card:hover {
            background: var(--card-raised);
            border-color: rgba(242, 240, 233, .14);
        }

        .card-title {
            margin: 0 0 8px;
            font-size: 1rem;
            font-weight: 620;
            letter-spacing: -.015em;
        }

        .gps-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            width: 100%;
            padding: 13px 0;
            border-bottom: 1px solid var(--line);
            font-size: .9rem;
        }

        .gps-row:last-of-type {
            border-bottom: 0;
        }

        .gps-icon {
            width: 24px;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .gps-label {
            color: var(--text-secondary);
        }

        .gps-value {
            font-weight: 600;
            margin-left: auto;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        footer {
            padding: 12px 8px 0;
            color: var(--text-secondary);
            font-size: .78rem;
            line-height: 1.6;
            text-align: center;
        }

        .footer-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;
        }

        footer a {
            color: var(--text);
            text-decoration: none;
            transition: color .2s;
        }

        footer a:hover {
            color: var(--primary);
        }

        .footer-version {
            display: inline-block;
            padding: 4px 10px;
            border: 1px solid rgba(215, 180, 119, .34);
            border-radius: 999px;
            color: var(--primary);
            background: var(--primary-soft);
            font-weight: 700;
            letter-spacing: .025em;
        }

        .footer-separator {
            color: rgba(242, 240, 233, .28);
        }

        .footer-prayer {
            margin: 8px 0 0;
            margin-bottom: 0;
            color: var(--primary);
            font-family: Georgia, "Noto Serif Devanagari", serif;
            font-size: .98rem;
            letter-spacing: .04em;
        }

        @media (max-width: 620px) {
            body {
                padding: 18px 12px;
            }

            .container {
                padding: 22px 16px;
                padding-bottom: 8px;
                border-radius: 22px;
            }

            .page-header {
                flex-direction: column;
                gap: 18px;
                padding-bottom: 22px;
            }

            .navigation {
                padding: 16px 0 20px;
            }

            .mat-btn {
                flex: 1;
                padding: 0 10px;
                font-size: .8rem;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>GPS information</h1>
                <p class="subtitle">Live position and satellite data.</p>
            </div>
            <div class="status" role="status" aria-live="polite">
                <span id="status-dot" class="dot"></span>
                <span id="status-text">Checking...</span>
            </div>
        </header>
        <nav class="navigation" aria-label="Device information">
            <a class="mat-btn" href="index.html">🏠 &nbsp; Home</a>
            <a class="mat-btn" href="hardware.html">⚙ &nbsp; Hardware</a>
        </nav>
        <div class="card">
            <h2 class="card-title">Current GPS data</h2>
            <div class="gps-row">
                <span class="gps-icon">&#128246;</span>
                <span class="gps-label">Satellites</span>
                <span class="gps-value" id="gps-sat">--</span>
            </div>
            <div class="gps-row">
                <span class="gps-icon">&#128205;</span>
                <span class="gps-label">Latitude</span>
                <span class="gps-value" id="gps-lat">--</span>
            </div>
            <div class="gps-row">
                <span class="gps-icon">&#128205;</span>
                <span class="gps-label">Longitude</span>
                <span class="gps-value" id="gps-lng">--</span>
            </div>
            <button id="see-on-map" class="mat-btn" style="display: none;">
                See on map
            </button>
            <div class="gps-row">
                <span class="gps-icon">&#128200;</span>
                <span class="gps-label">HDOP</span>
                <span class="gps-value" id="gps-hdop">--</span>
            </div>
            <div class="gps-row">
                <span class="gps-icon">&#11014;</span>
                <span class="gps-label">Altitude</span>
                <span class="gps-value" id="gps-alt">--</span>
            </div>
        </div>
        <footer>
            <div class="footer-meta">
                <a class="footer-version" id="footer-version" href="https://github.com/desiFish/ESP32-GPS-CLOCK-V1/releases"
                    target="_blank" rel="noopener noreferrer">--</a>
                <span class="footer-separator">·</span>
                <span>&copy; 2024</span>
                <span class="footer-separator">·</span>
                <a href="https://github.com/desiFish" target="_blank" rel="noopener noreferrer">desiFish</a>
                <span class="footer-separator">·</span>
                <span>Made in India 🇮🇳</span>
            </div>
            <p class="footer-prayer">ॐ नमो नारायणाय</p>
        </footer>
    </div>
    <script>
        fetch('/api/version')
            .then(r => r.ok ? r.text() : Promise.reject(new Error('Could not fetch version')))
            .then(version => {
                document.getElementById('footer-version').textContent = version;
            })
            .catch(err => console.error('Error fetching firmware version:', err));

        // Status indicator logic (same as index.html)
        function updateStatus() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1200);
            fetch('/api/status', { signal: controller.signal })
                .then(response => setStatus(response.ok))
                .catch(() => setStatus(false))
                .finally(() => clearTimeout(timeoutId));
        }

        function setStatus(isOnline) {
            document.getElementById('status-dot').classList.toggle('online', isOnline);
            document.getElementById('status-text').textContent = isOnline ? 'Online' : 'Offline';
        }
        setInterval(updateStatus, 3000);
        updateStatus();

        // Handle map button visibility and click
        const mapBtn = document.getElementById('see-on-map');
        mapBtn.addEventListener('click', () => {
            const lat = document.getElementById('gps-lat').textContent;
            const lng = document.getElementById('gps-lng').textContent;
            if (lat !== '--' && lng !== '--') {
                window.open(`https://www.google.com/maps/?q=${lat},${lng}`, '_blank');
            }
        });

        function fetchGps() {
            fetch('/api/gps')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('gps-sat').textContent = data.satellites ?? '--';
                    document.getElementById('gps-lat').textContent = data.lat !== undefined ? data.lat : '--';
                    document.getElementById('gps-lng').textContent = data.lng !== undefined ? data.lng : '--';
                    document.getElementById('gps-hdop').textContent = data.hdop !== undefined ? data.hdop : '--';
                    document.getElementById('gps-alt').textContent = data.alt !== undefined ? data.alt : '--';

                    // Show/hide map button based on valid coordinates
                    mapBtn.style.display = (data.lat !== undefined && data.lng !== undefined) ? 'inline-block' : 'none';
                })
                .catch(() => {
                    document.getElementById('gps-sat').textContent = '--';
                    document.getElementById('gps-lat').textContent = '--';
                    document.getElementById('gps-lng').textContent = '--';
                    document.getElementById('gps-hdop').textContent = '--';
                    document.getElementById('gps-alt').textContent = '--';
                    mapBtn.style.display = 'none';
                });
        }
        setInterval(fetchGps, 3000);
        fetchGps();

    </script>
</body>

</html>
